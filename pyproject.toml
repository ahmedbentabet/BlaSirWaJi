[project]
name = "blasirwaji"
version = "0.1.0"
description = "AI-powered Moroccan administrative document routing and cost estimation assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ahmed Ben Tabet", email = "61090548+ahmedbentabet@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
blasirwaji = "blasirwaji:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"